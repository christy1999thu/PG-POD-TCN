project:
  name: pg-pod-tcn-demo
  seed: 17

data:
  root: data/synthetic
  history: 12
  horizon: 4
  stride: 2
  train_fraction: 0.60
  val_fraction: 0.20
  split_seed: 17
  pod_energy: 0.995
  pod_max_modes: 32
  synthetic:
    cases: 10
    timesteps: 100
    height: 24
    width: 12
    dt: 0.02
    seed: 17

model:
  type: tcn
  channels: 64
  levels: 3
  kernel_size: 3
  dropout: 0.10

loss:
  coefficient: 1.0
  field: 0.5
  mass: 0.2
  bounds: 0.1
  macro: 0.5
  alpha_max: 0.64

training:
  device: auto
  epochs: 20
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 6
  gradient_clip: 1.0
  num_workers: 0
  seeds: [17]

ood:
  quantile: 0.99
  regularization: 0.001

output:
  root: outputs/demo

